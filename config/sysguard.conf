# SysGuard — configuración principal.
# Las rutas de logs/reportes/datos NO se configuran aquí: se calculan
# siempre a partir de la ubicación del proyecto (ver lib/config.sh),
# precisamente para evitar rutas relativas frágiles.

# ----------------------------------------------------------------------------
# Thresholds (porcentaje, 0-100). WARNING debe ser menor que CRITICAL.
# ----------------------------------------------------------------------------
CPU_WARNING=70
CPU_CRITICAL=90

RAM_WARNING=75
RAM_CRITICAL=90

SWAP_WARNING=50
SWAP_CRITICAL=80

DISK_WARNING=80
DISK_CRITICAL=90

# Severidad cuando la interfaz de red principal no tiene ruta default o
# aparece DOWN. Valores: critical | warning | ignore
NETWORK_DOWN=critical

# ----------------------------------------------------------------------------
# Disco
# ----------------------------------------------------------------------------
# Puntos de montaje a monitorear, separados por espacio. Vacío = autodetectar
# todos los filesystems reales (excluyendo DISK_EXCLUDE_TYPES).
DISK_PATHS=""

# Tipos de filesystem a ignorar en la autodetección (pseudo-filesystems).
DISK_EXCLUDE_TYPES="proc sysfs tmpfs devtmpfs overlay squashfs cgroup cgroup2 devpts mqueue tracefs debugfs configfs fusectl pstore binfmt_misc autofs"

# ----------------------------------------------------------------------------
# CPU
# ----------------------------------------------------------------------------
# Intervalo (segundos, admite decimales) entre las dos muestras de /proc/stat
# usadas para calcular el uso real de CPU.
CPU_SAMPLE_INTERVAL=1

# ----------------------------------------------------------------------------
# Alertas
# ----------------------------------------------------------------------------
# Segundos mínimos entre notificaciones repetidas del mismo estado para la
# misma métrica (evita spam si sysguard corre cada minuto por cron).
ALERT_COOLDOWN=300

# ----------------------------------------------------------------------------
# Historial
# ----------------------------------------------------------------------------
HISTORY_ENABLED=true
HISTORY_RETENTION_DAYS=7

# ----------------------------------------------------------------------------
# Logging
# ----------------------------------------------------------------------------
LOG_MAX_SIZE_KB=5120
LOG_RETENTION_DAYS=14

# ----------------------------------------------------------------------------
# Notificaciones. Valores: none | webhook
# Si es "webhook", define WEBHOOK_URL en config/secrets.conf (no en este
# archivo, que se versiona en git).
# ----------------------------------------------------------------------------
NOTIFICATION_METHOD=none
